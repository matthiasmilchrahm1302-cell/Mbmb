<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KM AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid white;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        .chat {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: #1c1c1c;
            border: 2px solid white;
            border-radius: 15px;
            overflow: hidden;
        }

        .chat-header {
            background: #000;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        #nachrichten {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
        }

        .nachricht {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
        }

        .du {
            background: #333;
            text-align: right;
        }

        .ki {
            background: #222;
            border: 1px solid #555;
        }

        .eingabe {
            display: flex;
            border-top: 2px solid #555;
        }

        #frage {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            outline: none;
            background: #333;
            color: white;
        }

        button {
            padding: 15px 25px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

<header>
    <h1>KM AI</h1>
    <p>Meine eigene künstliche Intelligenz</p>
</header>

<div class="chat">

    <div class="chat-header">
        KM AI Chat
    </div>

    <div id="nachrichten">

        <div class="nachricht ki">
            KM AI: Hallo! Wie kann ich dir helfen?
        </div>

    </div>

    <div class="eingabe">

        <input
            id="frage"
            type="text"
            placeholder="Schreibe eine Frage..."
            onkeydown="enterTaste(event)"
        >

        <button onclick="senden()">
            Senden
        </button>

    </div>

</div>


<script>

async function senden() {

    const feld = document.getElementById("frage");
    const frage = feld.value.trim();

    if (frage === "") {
        return;
    }

    const nachrichten =
        document.getElementById("nachrichten");

    // Frage anzeigen
    nachrichten.innerHTML += `
        <div class="nachricht du">
            Du: ${frage}
        </div>
    `;

    feld.value = "";

    // Ladeanzeige
    nachrichten.innerHTML += `
        <div class="nachricht ki" id="laden">
            KM AI: Ich denke nach...
        </div>
    `;

    nachrichten.scrollTop =
        nachrichten.scrollHeight;

    try {

        const antwort = await fetch(
            "http://127.0.0.1:5000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    frage: frage
                })
            }
        );

        const daten = await antwort.json();

        document.getElementById("laden").remove();

        nachrichten.innerHTML += `
            <div class="nachricht ki">
                KM AI: ${daten.antwort}
            </div>
        `;

    } catch (fehler) {

        document.getElementById("laden").remove();

        nachrichten.innerHTML += `
            <div class="nachricht ki">
                KM AI: Der Python-Server ist gerade nicht erreichbar.
            </div>
        `;
    }

    nachrichten.scrollTop =
        nachrichten.scrollHeight;
}


function enterTaste(event) {

    if (event.key === "Enter") {
        senden();
    }

}

</script>

</body>
</html>
