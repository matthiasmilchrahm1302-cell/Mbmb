
<div class="card">
  <h2>Einheitliche Feldtheorie kaufen</h2>

  <label for="kundenname">Dein Name</label>
  <input id="kundenname" type="text" placeholder="Namen eingeben">

  <button class="action primary" onclick="verkaeuferBenachrichtigen()">
    Verkäufer benachrichtigen
  </button>

  <div id="kaufAnfrage" style="display:none; margin-top:20px;">
    <h3>Deine Kaufanfrage</h3>
    <textarea id="emailText" readonly></textarea>
    <button class="action primary" onclick="emailOeffnen()">
      E-Mail öffnen
    </button>
    <button class="action" onclick="textKopieren()">
      Text kopieren
    </button>
    <p id="statusText"></p>
  </div>
</div>

<script>
function verkaeuferBenachrichtigen() {
  const name = document.getElementById("kundenname").value.trim();

  if (!name) {
    alert("Bitte gib zuerst deinen Namen ein!");
    return;
  }

  document.getElementById("emailText").value =
    name + " möchte die Einheitliche Feldtheorie kaufen.";

  document.getElementById("kaufAnfrage").style.display = "block";
  document.getElementById("statusText").textContent =
    "Kaufanfrage erstellt! Du kannst jetzt die E-Mail öffnen.";
}

function emailOeffnen() {
  const email = "matthias.milchrahm1302@gmail.com";
  const betreff = "Kaufanfrage: Einheitliche Feldtheorie";
  const nachricht = document.getElementById("emailText").value;

  window.location.href =
    "mailto:" + email +
    "?subject=" + encodeURIComponent(betreff) +
    "&body=" + encodeURIComponent(nachricht);
}

async function textKopieren() {
  const text = document.getElementById("emailText").value;

  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("statusText").textContent =
      "Text kopiert! Du kannst ihn in eine E-Mail einfügen.";
  } catch (e) {
    document.getElementById("emailText").select();
    document.getElementById("statusText").textContent =
      "Text markiert. Drücke Strg+C zum Kopieren.";
  }
}
</script>
