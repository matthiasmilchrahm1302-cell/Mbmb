
<style>
#namensFenster {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #080d18;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.namensKarte {
  width: 100%;
  max-width: 420px;
  padding: 30px;
  background: #111a2b;
  border: 1px solid #293752;
  border-radius: 16px;
  color: #e9f0ff;
  font-family: Arial, sans-serif;
}

.namensKarte h1 {
  font-size: 25px;
}

.namensKarte p {
  color: #92a2bd;
  line-height: 1.5;
}

.namensKarte input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin: 12px 0;
  background: #080d18;
  color: white;
  border: 1px solid #293752;
  border-radius: 8px;
}

.namensKarte button {
  width: 100%;
  padding: 13px;
  background: #2365bc;
  color: white;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
</style>

<div id="namensFenster">
  <div class="namensKarte">
    <h1>Willkommen im FieldLab</h1>
    <p>Wie heißt du? Wähle deinen Namen, um das Labor zu betreten.</p>

    <form id="namenFormular">
      <input
        id="besucherName"
        type="text"
        placeholder="Dein Name"
        maxlength="60"
        required
        autocomplete="nickname"
      >
      <button type="submit">Labor betreten →</button>
    </form>
  </div>
</div>

<script>
const namensFenster = document.getElementById("namensFenster");
const namenFeld = document.getElementById("besucherName");

// Namen während dieses Website-Besuchs merken
let kundenName = "";

document.getElementById("namenFormular").addEventListener("submit", function(e) {
  e.preventDefault();

  kundenName = namenFeld.value.trim();

  if (!kundenName) {
    alert("Bitte gib deinen Namen ein.");
    return;
  }

  namensFenster.style.display = "none";
});

// Diese Funktion beim Kauf-Button verwenden
function verkaeuferBenachrichtigen() {
  if (!kundenName) {
    alert("Bitte wähle zuerst deinen Namen aus.");
    namensFenster.style.display = "flex";
    return;
  }

  const empfaenger = "matthias.milchrahm1302@gmail.com";
  const betreff = "Kaufanfrage: Einheitliche Feldtheorie";

  const nachricht =
    kundenName +
    " möchte die Einheitliche Feldtheorie kaufen.\n\n" +
    "Bitte antworte mir auf diese E-Mail.";

  const link = "mailto:" + empfaenger +
    "?subject=" + encodeURIComponent(betreff) +
    "&body=" + encodeURIComponent(nachricht);

  window.location.href = link;
}
</script>
</body>
