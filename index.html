<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbmb</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #555;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

<header>
    <h1>Willkommen bei Mbmb</h1>
    <p>Was wollen Sie?</p>
</header>

<nav>
    <a href="#">Start</a>
    <a href="#">Über uns</a>
    <a href="#kontakt">Kontakt</a>
</nav>

<div class="container">

    <div class="card">
        <h2>Produktliste</h2>
        <p>Zeitdiebe (Kartenspiel), Gutscheine</p>
    </div>

    <div class="card">
        <h2>Aktion</h2>
        <p>Nach fünf Käufen einen Gutschein – wir freuen uns!</p>
    </div>

    <div class="card" id="kontakt">
        <h2>Kontakt</h2>
        <p>Email: <a href="mailto:matthias.milchrahm1302@gmail.com">matthias.milchrahm@gmail.com</a></p>

</div>

</footer>

</html>
